name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar error de compilación
        if: failure()
        shell: bash
        run: |
          msg=$( (grep -A25 "What went wrong" build.log || tail -40 build.log) | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle::${msg}"
          exit 1

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Conteo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Conteo-apk
          path: Conteo.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" Conteo.apk \
            --title "Conteo 1.${{ github.run_number }}" \
            --notes "APK lista para instalar. Descargá Conteo.apk desde el celular y abrila."
