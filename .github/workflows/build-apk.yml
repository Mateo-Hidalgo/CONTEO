name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Conteo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Conteo-apk
          path: Conteo.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" Conteo.apk \
            --title "Conteo 1.${{ github.run_number }}" \
            --notes "APK lista para instalar. Descargá Conteo.apk desde el celular y abrila."
